worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Resolver DNS public: indispensable pour re-résoudre les hôtes upstream à
    # l'exécution. Sans ça, Nginx résout l'IP une seule fois au démarrage et la
    # garde en cache => quand un service Render redémarre et change d'IP, le
    # proxy tape sur une IP morte et la requête reste bloquée jusqu'au timeout.
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 10s;

    # Augmenter les timeouts pour le "cold start" (réveil) des services Render en version gratuite (ça prend souvent > 60s)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    server {
        # Render fournit le port via $PORT (substitué au démarrage par start-nginx.sh)
        listen       __PORT__;
        server_name  localhost;

        location / {
            return 200 'API Gateway is running';
            add_header Content-Type text/plain;
        }

        location /api/accounts {
            # URL et hôte stockés dans des variables => Nginx utilise le resolver
            # et ré-évalue le DNS à chaque requête (au lieu d'une seule fois au boot).
            set $account_upstream "__ACCOUNT_SERVICE_URL__";
            set $account_host "__ACCOUNT_SERVICE_HOST__";
            proxy_pass $account_upstream$request_uri;
            proxy_ssl_server_name on;
            proxy_set_header Host $account_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/transactions {
            set $transaction_upstream "__TRANSACTION_SERVICE_URL__";
            set $transaction_host "__TRANSACTION_SERVICE_HOST__";
            proxy_pass $transaction_upstream$request_uri;
            proxy_ssl_server_name on;
            proxy_set_header Host $transaction_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
