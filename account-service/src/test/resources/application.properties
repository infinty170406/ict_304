# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Transaction service url for tests
transaction.service.url=https://transaction-service-lyn1.onrender.com/api/transactions
