# Configuration du serveur
server.port=${PORT:8081}

# Configuration de la base de données (PostgreSQL sur Render, H2 en local par défaut)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accountdb}
spring.datasource.username=${DB_USER:SA}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# URL du service de transactions
transaction.service.url=${TRANSACTION_URL:http://localhost:8082/api/transactions}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson (JSON date format)
spring.jackson.serialization.write-dates-as-timestamps=false
