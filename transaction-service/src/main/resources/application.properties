# Configuration du serveur
server.port=${PORT:8082}

# Configuration de la base de données (PostgreSQL sur Render, H2 en local par défaut)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transactiondb}
spring.datasource.username=${DB_USER:SA}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Console H2 (disponible sur http://localhost:3000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson (JSON date format)
spring.jackson.serialization.write-dates-as-timestamps=false
