services:
  - type: web
    name: infinite-bank-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://api-gateway-j0ls.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
