databases:
  - name: banking-postgres
    databaseName: bankdb
    user: admin

services:
  # 1. Transaction Service (Private)
  - type: pserv
    name: transaction-service
    env: docker
    dockerfilePath: Dockerfile.transaction
    envVars:
      - key: PORT
        value: 8082
      - key: DATABASE_URL
        fromDatabase:
          name: banking-postgres
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: banking-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: banking-postgres
          property: password

  # 2. Account Service (Private)
  - type: pserv
    name: account-service
    env: docker
    dockerfilePath: Dockerfile.account
    envVars:
      - key: PORT
        value: 8081
      - key: TRANSACTION_URL
        value: http://transaction-service:8082/api/transactions
      - key: DATABASE_URL
        fromDatabase:
          name: banking-postgres
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: banking-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: banking-postgres
          property: password

  # 3. API Gateway Nginx (Web Service)
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: Dockerfile.nginx
    envVars:
      - key: PORT
        value: 80
