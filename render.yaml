services:
  - type: web
    name: infinite-bank-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://votre-backend-url.onrender.com" # TODO: À remplacer par la vraie URL de votre backend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
